# CT.gov query presets for ingest.py
# Run with: python ingest.py <preset_name>
# Keys map directly to CT.gov API v2 parameters.
# See https://clinicaltrials.gov/data-api/api for the full reference.

nsclc_kras:
  query.cond: '"non-small cell lung cancer" OR NSCLC'
  query.intr: '"KRAS G12C inhibitor"'

nsclc_2line:
  query.cond: '"metastatic NSCLC" OR "metastatic non-small cell lung cancer"'
  query.term: '"second line" OR "second-line" OR "previously treated"'

nsclc_ppp:
  query.cond: Non-small Cell Lung Cancer
  query.intr: pembrolizumab platinum pemetrexed
  query.term: non-squamous 
  # excluded metastatic because I got a few extra good studies without it
  # query.outc: PFS OS

# tested, confirmed it fetches all 19 studies listed by id.
EXAMPLE_seach_by_nct_id:
  query.id: "NCT03976323 NCT04194944 NCT02142738 NCT06212752 NCT05775289 NCT05722015 NCT02220894 NCT03850444 NCT02578680 NCT03425643 NCT04956692 NCT03631199 NCT02591615 NCT04619797 NCT04524689 NCT05226598 NCT03950674 NCT03515837 NCT04222972"